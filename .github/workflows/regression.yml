name: Schema Regression

on:
  workflow_dispatch:  # allow manual re-run from Actions tab
  pull_request:
    paths:
      - '**.json'
      - '**.yaml'
      - '**.yml'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  push:
    branches: [main, master]
    paths:
      - '**.json'
      - '**.yaml'
      - '**.yml'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'

jobs:
  schema-regression:
    name: Detect Breaking Schema Changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run unit tests
        run: npm test

      - name: Run schema regression check
        run: node src/index.js schema.json --snapshots-dir snapshots
