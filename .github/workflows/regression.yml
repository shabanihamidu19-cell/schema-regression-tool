name: Schema Regression

on:
  pull_request:
    paths:
      - '**.json'
      - '**.yaml'
      - '**.yml'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
  push:
    branches: [main, master]
    paths:
      - '**.json'
      - '**.yaml'
      - '**.yml'
      - 'src/**'

jobs:
  schema-regression:
    name: Detect Breaking Schema Changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Run schema regression check
        run: node src/index.js schema.json --snapshots-dir snapshots
